<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShilpSetu — Your craft. Your digital business.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js">
    </script>
    <style>
        :root {
            --ink: #241C14;
            --ink-soft: #5A4F41;
            --paper: #FBF4E6;
            --paper-warm: #F3E7CE;
            --card: #FFFDF8;
            --line: #E7D9B8;
            --bamboo: #2E4A34;
            --bamboo-deep: #1D3024;
            --clay: #B5502E;
            --clay-deep: #8E3B21;
            --gold: #E3A63E;
            --teal: #2F6F62;
            --ok: #3E7D4C;
            --shadow: 0 18px 40px -20px rgba(36, 28, 20, 0.35);
        }
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
        }
        body {
            background:
                radial-gradient(1200px 600px at 12% -10%, #F6E9CC 0%, transparent 60%),
                radial-gradient(1000px 700px at 100% 10%, #EFDCB1 0%, transparent 55%),
                var(--paper);
            font-family: 'Manrope', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        h1,
        h2,
        h3,
        .serif {
            font-family: 'Fraunces', serif;
        }
        button {
            font-family: inherit;
            cursor: pointer;
        }
        ::selection {
            background: var(--gold);
            color: var(--ink);
        }

        .stage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
            gap: 40px;
        }
        .stage-side {
            display: none;
        }
        @media(min-width:1040px) {
            .stage-side {
                display: flex;
                flex-direction: column;
                gap: 18px;
                width: 300px;
            }
        }
        .brandmark {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brandmark .logo {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: linear-gradient(155deg, var(--bamboo) 0%, var(--bamboo-deep) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }
        .side-note {
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--ink-soft);
            border-left: 2px solid var(--line);
            padding-left: 16px;
        }
        .side-quote {
            font-family: 'Fraunces', serif;
            font-size: 22px;
            font-style: italic;
            color: var(--bamboo-deep);
            line-height: 1.35;
        }

        .phone {
            width: 390px;
            max-width: 100%;
            height: 820px;
            max-height: 92vh;
            background: var(--card);
            border-radius: 44px;
            border: 10px solid var(--ink);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 26px;
            background: var(--ink);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 50;
        }
        .statusbar {
            height: 44px;
            flex: 0 0 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 26px;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
        }
        .screen {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            scrollbar-width: none;
        }
        .screen::-webkit-scrollbar {
            display: none;
        }
        .screen-inner {
            padding: 22px 22px 30px;
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: .02em;
            color: var(--bamboo-deep);
            background: #E7EFDF;
            border: 1px solid #CFE0C4;
            padding: 5px 11px;
            border-radius: 99px;
            width: fit-content;
        }
        .tag.ai {
            background: #FBEFD9;
            border-color: #EED9A6;
            color: #8A5A12;
        }
        .tag.live {
            background: #FDE7E1;
            border-color: #F3C3B4;
            color: #B5502E;
        }

        .btn-primary {
            background: var(--bamboo);
            color: #fff;
            border: none;
            padding: 16px 22px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            box-shadow: 0 10px 22px -8px rgba(29, 48, 36, .55);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn-primary:active {
            transform: scale(.98);
        }
        .btn-primary:disabled {
            opacity: .45;
            box-shadow: none;
        }
        .btn-secondary {
            background: transparent;
            color: var(--bamboo-deep);
            border: 1.5px solid var(--line);
            padding: 15px 22px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15.5px;
            width: 100%;
        }
        .btn-clay {
            background: var(--clay);
            color: #fff;
            border: none;
            padding: 16px 22px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            box-shadow: 0 10px 22px -8px rgba(142, 59, 33, .55);
        }
        .btn-ghost {
            background: transparent;
            border: none;
            color: var(--ink-soft);
            font-weight: 700;
            font-size: 14.5px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px;
        }
        .field-label {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 6px;
            letter-spacing: .01em;
        }

        .mic-btn {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--clay) 0%, var(--clay-deep) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            box-shadow: 0 14px 30px -10px rgba(142, 59, 33, .6);
            position: relative;
        }
        .mic-pulse {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 2px solid rgba(181, 80, 46, .45);
            animation: pulse 1.6s ease-out infinite;
        }
        .mic-pulse.p2 {
            animation-delay: .5s;
        }
        @keyframes pulse {
            0% {
                transform: scale(.85);
                opacity: .9;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        .wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 44px;
            justify-content: center;
        }
        .wave span {
            width: 4px;
            border-radius: 3px;
            background: var(--clay);
            animation: wv .9s ease-in-out infinite;
        }
        @keyframes wv {
            0%,
            100% {
                height: 8px;
            }
            50% {
                height: 38px;
            }
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            font-size: 14.5px;
            color: var(--ink-soft);
            opacity: 0;
            transform: translateY(6px);
            animation: riseIn .4s ease forwards;
        }
        @keyframes riseIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .check-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--ok);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 22px;
        }
        .check-dot.pending {
            background: #EDE3C8;
        }

        .progressdots {
            display: flex;
            gap: 5px;
            margin-bottom: 14px;
        }
        .progressdots span {
            height: 4px;
            flex: 1;
            border-radius: 3px;
            background: var(--line);
        }
        .progressdots span.on {
            background: var(--bamboo);
        }

        .bottomnav {
            flex: 0 0 74px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid var(--line);
            background: var(--card);
        }
        .navitem {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-soft);
            background: none;
            border: none;
        }
        .navitem.active {
            color: var(--bamboo-deep);
        }

        .slider-wrap {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--line);
        }
        .slider-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, .6);
        }
        .slider-grip {
            position: absolute;
            top: 50%;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, .25);
        }

        .fade-in {
            animation: fadeIn .45s ease both;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            animation: flashOut .35s ease forwards;
        }
        @keyframes flashOut {
            0% {
                opacity: .9;
            }
            100% {
                opacity: 0;
            }
        }

        .chip {
            background: var(--paper-warm);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 13.5px;
        }

        input[type=text],
        input[type=number],
        textarea {
            width: 100%;
            border: 1.5px solid var(--line);
            border-radius: 14px;
            padding: 13px 14px;
            font-family: inherit;
            font-size: 15px;
            background: #fff;
            color: var(--ink);
        }
        input:focus,
        textarea:focus {
            outline: 2px solid var(--gold);
            outline-offset: 1px;
        }

        .match-ring {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            color: #fff;
            flex: 0 0 54px;
        }

        .toast {
            position: absolute;
            left: 22px;
            right: 22px;
            bottom: 96px;
            background: var(--ink);
            color: #fff;
            padding: 13px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
            animation: fadeIn .3s ease both;
            z-index: 60;
        }

        .edit-input {
            border-color: var(--gold);
            background: #FFFDF5;
        }
        .edit-input:focus {
            outline: 2px solid var(--gold);
        }

        .editable-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-top: 1px solid var(--line);
            align-items: center;
        }
        .editable-row:first-child {
            border-top: none;
        }
        .editable-row .label {
            font-size: 13px;
            color: var(--ink-soft);
            font-weight: 700;
        }
        .editable-row .value {
            font-size: 13.5px;
            font-weight: 700;
            text-align: right;
        }
        .editable-row .value-input {
            width: 140px;
            text-align: right;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1.5px solid var(--line);
            font-size: 13.5px;
            font-weight: 700;
            background: #fff;
        }
        .editable-row .value-input:focus {
            border-color: var(--gold);
            outline: none;
        }

        .inline-edit-textarea {
            width: 100%;
            min-height: 80px;
            border: 1.5px solid var(--gold);
            border-radius: 14px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            background: #FFFDF5;
            color: var(--ink);
            resize: vertical;
        }
        .inline-edit-textarea:focus {
            outline: 2px solid var(--gold);
            outline-offset: 1px;
        }

        .inline-edit-input {
            border: 1.5px solid var(--gold);
            border-radius: 14px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 15px;
            background: #FFFDF5;
            color: var(--ink);
            width: 100%;
        }
        .inline-edit-input:focus {
            outline: 2px solid var(--gold);
            outline-offset: 1px;
        }

        .toast-success {
            background: var(--ok);
            color: #fff;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            background: var(--paper-warm);
            color: var(--ink-soft);
            cursor: pointer;
        }
        .btn-sm:hover {
            background: var(--line);
        }
        .btn-sm.primary-sm {
            background: var(--bamboo);
            color: #fff;
        }
        .btn-sm.primary-sm:hover {
            background: var(--bamboo-deep);
        }

        .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .edit-actions button {
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }
        .edit-actions .save-btn {
            background: var(--bamboo);
            color: #fff;
        }
        .edit-actions .save-btn:hover {
            background: var(--bamboo-deep);
        }
        .edit-actions .cancel-btn {
            background: var(--paper-warm);
            color: var(--ink-soft);
        }
        .edit-actions .cancel-btn:hover {
            background: var(--line);
        }

        .voice-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 99px;
            background: rgba(181, 80, 46, 0.12);
            border: 1px solid var(--clay);
            font-weight: 600;
            font-size: 13px;
            color: var(--clay-deep);
            animation: pulse-border 1.2s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%,
            100% {
                border-color: var(--clay);
            }
            50% {
                border-color: #d47a5a;
            }
        }
    </style>
</head>

            return (
                <div style={ { margin: "6px 0 4px" } }>

        // ---------- VOICE DESCRIPTION ----------
        const DESC_LINES_EN = [
            "This is a bamboo storage basket.",
            "I make it by hand using natural bamboo.",
            "It takes about three days to complete.",
            "I learned this craft from my mother."
        ];
        const DESC_LINES_HI = [
            "यह एक बाँस स्टोरेज बास्केट है।",
            "मैं इसे प्राकृतिक बाँस का उपयोग करके हाथ से बनाती हूँ।",
            "इसे पूरा करने में लगभग तीन दिन लगते हैं।",
            "मैंने यह शिल्प अपनी माँ से सीखा।"
        ];tion useRecorder(lines, onFinish, msPerLine = 1500) {
            const [seconds, setSeconds] = useState(0);
            const [shownLines, setShownLines] = useState(0);
            useEffect(() => {
                const timer = setInterval(() => setSeconds(s => s + 1), 1000);
                return () => clearInterval(timer);
            }, []);
            useEffect(() => {
                if (shownLines >= lines.length) { const t = setTimeout(onFinish, 700); return () => clearTimeout(t); }
                const t = setTimeout(() => setShownLines(s => s + 1), msPerLine);
                return () => clearTimeout(t);
            }, [shownLines]);
            return { seconds, shownLines };
        }

        function VoiceDescribe({ go, back }) {
            const s = useStrings();
            const { lang } = useContext(LanguageContext);
            const lines = lang === "hi" ? DESC_LINES_HI : DESC_LINES_EN;
            const [phase, setPhase] = useState("idle");
            return (
                <ScreenShell>
                    <Header title={ s.tellProduct } sub={ s.tellProductSub } onBack={ back } />

                            <div style={ { fontWeight: 700, fontSize: 15 } }>{ s.tapAndSpeak }</div>
                        </div>
                    ) }
                    { phase === "rec" && <RecordingPanel lines={ lines } onFinish={ () => setPhase("done") } /> }
                    { phase === "done" && (
                        <div style={ { flex: 1, display: "flex", flexDirection: "column", justifyContent: "center" } }>
                            <div className="tag" style={ { marginBottom: 10 } }>{ s.recordingComplete }</div>
                            <div className="card" style={ { fontSize: 14.5, lineHeight: 1.6 } }>{ lines.join(" ") }</div>
                        </div>
                    ) }
                    <div style={ { flex: phase === "idle" ? 0 : 1 } }></div>
                    { phase === "done" && <button className="btn-primary" onClick={ () => go("understandVoice") }>{ s
                            .continue }</button> }
                </ScreenShell>
            );
        }

        function RecordingPanel({ lines, onFinish }) {
            const { seconds, shownLines } = useRecorder(lines, onFinish);
            const mm = String(Math.floor(seconds / 60)).padStart(2, "0");
            const ss = String(seconds % 60).padStart(2, "0");
            const s = useStrings();
            return (
                <div style={ { flex: 1, display: "flex", flexDirection: "column", gap: 16 } }>
                    <div style={ { display: "flex", flexDirection: "column", alignItems: "center", gap: 10 } }>
                        <div className="mic-btn" style={ { width: 74, height: 74 } }>

                    <div className="card" style={ { minHeight: 110 } }>
                        <div className="field-label">Live transcript</div>
                        { lines.slice(0, shownLines).map((l, i) => (
                            <p key={ i } className="fade-in" style={ { margin: "0 0 6px", fontSize: 14.5,
                                    lineHeight: 1.5 } }>{ l }</p>
                        )) }

                                    animation: "pulse 1s infinite" } }></span> }
                    </div>
                </div>
            );

            const [isEditing, setIsEditing] = useState(false);
            const [message, setMessage] = useState(
                "Namaste. Thank you for your interest in my handmade bamboo baskets. I can provide 5 pieces at ₹950 each. Please let me know if you would like to discuss the order."
            );

            const handleSend = () => {
                setSent(true);
                setIsEditing(false);
                setTimeout(() => { }, 3000);
            };

            return (
                <ScreenShell>
                    <Header title={ s.buyerDetailTitle } tagText={ s.matchTag } onBack={ back } />
                    <div className="card" style={ { marginBottom: 16 } }>
                        <div style={ { fontWeight: 700, fontSize: 14.5, marginBottom: 4 } }>{ s.interestedQty }</div>
                        <div style={ { fontSize: 13, color: "var(--ink-soft)" } }>{ s.expectedPrice }</div>
                    </div>
                    <div className="tag ai" style={ { marginBottom: 10 } }><Icon name="sparkle" size={ 13 } /> { s
                            .suggestedReply }</div>
                    <div className="card" style={ { marginBottom: 16 } }>
                        { isEditing ? (
                            <textarea className="inline-edit-textarea" value={ message } onChange={ e => setMessage(e.target
                                    .value) } rows={ 5 } />
                        ) : (
                            <p style={ { margin: 0, fontSize: 14, lineHeight: 1.6 } }>{ message }</p>
                        ) }
                    </div>
                    <div style={ { flex: 1 } }></div>
                    { !sent ? (
                        <div style={ { display: "flex", flexDirection: "column", gap: 10 } }>
                            { isEditing ? (
                                <div style={ { display: "flex", gap: 10 } }>
                                    <button className="btn-primary" onClick={ handleSend } style={ { flex: 1 } }><Icon
                                            name="send" size={ 16 } color="#fff" /> { s.send }</button>
                                    <button className="btn-secondary" onClick={ () => setIsEditing(false) } style={ { flex: 1 } }>{ s
                                            .cancel }</button>
                                </div>
                            ) : (
                                <>
                                    <button className="btn-primary" style={ { display: "flex", alignItems: "center",
                                            justifyContent: "center", gap: 8 } } onClick={ handleSend }><Icon name="send"
                                            size={ 16 } color="#fff" /> { s.send }</button>
                                    <div style={ { display: "flex", gap: 10 } }>
                                        <button className="btn-secondary" style={ { flex: 1 } } onClick={ () => setIsEditing(
                                            true) }>{ s.editReply }</button>
                                        <button className="btn-secondary" style={ { flex: 1 } } onClick={ handleSend }>{ s
                                                .useSuggestion }</button>
                                    </div>
                                </>
                            ) }
                        </div>
                    ) : (
                        <button className="btn-primary" onClick={ () => go("copilot") }>{ s.checkBusiness }</button>
                    ) }
                    { sent && <div className="toast"><Icon name="check" size={ 16 } /> { s.messageSent }</div> }
                </ScreenShell>
            );
        }

        // ---------- COPILOT WITH SIMULATED VOICE ----------
        function Copilot({ go, back }) {
            const s = useStrings();
            const [asked, setAsked] = useState(false);
            const [listening, setListening] = useState(false);
            const [transcript, setTranscript] = useState("");
            const [response, setResponse] = useState("");

            const startListening = () => {
                setListening(true);
                setTranscript("");
                setAsked(false);
                setTimeout(() => {
                    const question = s.copilotQuestion || "How is my business doing?";
                    setTranscript(question);
                    setTimeout(() => {
                        setListening(false);
                        const reply = s.copilotResponseDetailed || s.copilotResponse;
                        setResponse(reply);
                        setAsked(true);
                    }, 1500);
                }, 2000);
            };

            const handleQuestion = (q) => {
                setTranscript(q);
                setListening(true);
                setTimeout(() => {
                    setListening(false);
                    let reply = s.copilotResponseDetailed || s.copilotResponse;
                    if (q.toLowerCase().includes("product") || q.toLowerCase().includes("best")) {
                        reply = "Your bamboo basket is your best-selling product with 4 units sold this month.";
                    } else if (q.toLowerCase().includes("contact") || q.toLowerCase().includes("who")) {
                        reply = "You should contact Rajasthan Home Living – they showed strong interest.";
                    } else if (q.toLowerCase().includes("improve") |q.toLowerCase().includes("sales")) {
                        reply = "Consider offering a small discount on bulk orders or highlighting your craft story more.";
                    }
                    setResponse(reply);
                    setAsked(true);
                }, 1500);
            };

            return (
                <ScreenShell>
                    <Header title={ s.copilotTitle } tagText={ s.copilotTag } tagType="ai" onBack={ back } />
                    <div style={ { flex: 1, display: "flex", flexDirection: "column", gap: 12 } }>
                        <div style={ { alignSelf: "flex-end", background: "var(--bamboo)", color: "#fff", padding: "12px 15px",
                                borderRadius: "16px 16px 4px 16px", maxWidth: "80%", fontSize: 14 } }>
                            { s.howBusiness }
                        </div>
                        { !asked && (
                            <button className="btn-secondary" style={ { maxWidth: 180 } } onClick={ startListening }>
                                <Icon name="mic" size={ 16 } style={ { marginRight: 8 } } /> { s.ask }
                            </button>
                        ) }
                        { listening && (
                            <div className="voice-indicator" style={ { alignSelf: "flex-start" } }>
                                <Icon name="mic" size={ 16 } color="var(--clay)" />
                                { s.listeningCopilot }
                                <Waveform style={ { width: 60, height: 20 } } />
                            </div>
                        ) }
                        { transcript && !listening && (
                            <div className="chip" style={ { alignSelf: "flex-start", background: "#E7EFDF" } }>
                                <strong>You:</strong> { transcript }
                            </div>
                        ) }
                        { asked && !listening && response && (
                            <div className="fade-in" style={ { alignSelf: "flex-start", background: "var(--paper-warm)",
                                    border: "1px solid var(--line)", padding: "14px 16px",
                                    borderRadius: "16px 16px 16px 4px", maxWidth: "85%", fontSize: 14, lineHeight: 1.6 } }>
                                { response.split('\n').map((line, i) => <div key={ i }>{ line }</div>) }
                            </div>
                        ) }
                        { asked && (
                            <div style={ { display: "flex", flexDirection: "column", gap: 8, marginTop: 6 } }>
                                { s.suggestedQuestions.map(q => (
                                    <button key={ q } className="chip" style={ { textAlign: "left" } } onClick={ () =>
                                            handleQuestion(q) }>{ q }</button>
                                )) }
                            </div>
                        ) }
                    </div>
                    <button className="btn-primary" style={ { marginTop: 16 } } onClick={ () => go("summary") }>{ s
                            .finishJourney }</button>
                </ScreenShell>
            );
        }

        // ---------- SUMMARY ----------
        function Summary({ go, back }) {
            const s = useStrings();
            const journey = ["Handmade product", "Takes photo", "AI improves photo", "Speaks", "AI understands",
                "AI creates catalog", "AI creates craft story", "AI suggests price", "Meera approves", "Product goes live",
                "AI finds buyers", "Business grows"
            ];
            return (
                <ScreenShell>
                    <Header title="Journey Complete" onBack={ back } />
                    <div style={ { display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center",
                            gap: 14, marginBottom: 20 } }>
                        <div style={ { display: "flex", gap: -10 } }>
                            <MeeraPortrait size={ 80 } />
                        </div>
                        <div style={ { height: 70 } }><ProductImage size={ 70 } /></div>
                    </div>
                    <div className="card" style={ { marginBottom: 18 } }>
                        { journey.map((j, i) => (
                            <div key={ j } style={ { display: "flex", alignItems: "center", gap: 10, padding: "6px 0" } }>
                                <span style={ { width: 6, height: 6, borderRadius: "50%", background: "var(--bamboo)",
                                        flex: "0 0 6px" } }></span>
                                <span style={ { fontSize: 13, fontWeight: 600 } }>{ j }</span>
                            </div>
                        )) }
                    </div>
                    <div style={ { textAlign: "center", marginBottom: 18 } }>
                        <div className="serif" style={ { fontSize: 15, fontStyle: "italic", color: "var(--ink-soft)",
                                marginBottom: 10 } }>"AI does the digital work.<br />The artisan does the craft."</div>
                        <div className="serif" style={ { fontSize: 19, fontWeight: 600, color: "var(--bamboo-deep)",
                                lineHeight: 1.4 } }>{ s.journeySummary }</div>
                    </div>
                    <button className="btn-secondary" onClick={ () => go("home") }>{ s.backToHome }</button>
                </ScreenShell>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
